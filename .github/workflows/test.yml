name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Neovim
        run: sudo apt-get update && sudo apt-get install -y neovim

      - name: Use npm 11.9.0
        run: npm install --global npm@11.9.0

      - run: npm ci
      - run: npm run lint
      - run: npm test
